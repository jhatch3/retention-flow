# Local Postgres for RetentionFlow development.
# Start with:  docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: retention_flow_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retention_flow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retention_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
