[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retention-flow"
version = "0.1.0"
description = "Churn-Aware Retention - ML + LLM system for grounded retention emails"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "mlflow>=2.16",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    # LLM — retention-email generator + LLM-as-judge
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
