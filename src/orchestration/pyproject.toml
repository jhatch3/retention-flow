[project]
name = "retention-orchestration"
version = "0.1.0"
description = "Dagster orchestration for the RetentionFlow dbt pipeline"
requires-python = ">=3.11"
dependencies = [
    "dagster",
    "dagster-dbt",
    "dagster-webserver",
    "dbt-postgres>=1.8",
]

[tool.dagster]
module_name = "retention_orchestration.definitions"
code_location_name = "retention_flow"

[tool.setuptools]
packages = ["retention_orchestration"]
